[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fourd-mind"
version = "1.2.0"
description = "4D Mind — Non-causal 4D spacetime transformer, 4D Spatiotemporal Code Lens, and five interactive studios"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
train = [
    "torch>=2.2",
    "pytest>=8.0",
]
voice = [
    "torch>=2.2",
    "transformers>=4.44",
    "peft>=0.12",
    "accelerate>=0.33",
    "gradio>=4.40",
    "matplotlib>=3.8",
]

[project.scripts]
4d-mind = "tesseract.demo:main"
4d-mind-risk = "tesseract.risk:main"
4d-mind-codeblock = "tesseract.codeblock:main"
4d-mind-train = "tesseract.train:main"

[tool.setuptools]
packages = ["tesseract"]
include-package-data = true

[tool.setuptools.package-data]
tesseract = ["../web/*", "../lives/*"]
