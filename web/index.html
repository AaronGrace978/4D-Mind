<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4D Block Mind — Iris</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <p class="mark">4D-MIND</p>
    <h1>Block resident</h1>
    <p class="sub">Iris, held as one solid. Time is an axis you can turn.</p>
  </header>
  <main class="layout">
    <div class="stage-wrap">
      <canvas id="stage"></canvas>
      <p class="hint">
        <span><i class="mint"></i>body</span>
        <span><i class="rose"></i>tissue</span>
        <span><i class="amber"></i>scar</span>
        <span><i class="blue"></i>other</span>
        <span>drag to orbit · click to probe</span>
      </p>
    </div>
    <aside>
      <section>
        <h2>Reading</h2>
        <p id="reading">Loading the solid…</p>
      </section>
      <section class="controls">
        <label>
          Rotate time into x
          <output id="angle-readout">0°</output>
          <input id="xt" type="range" min="-180" max="180" value="0">
        </label>
        <label>
          Cutting plane
          <select id="cut-axis">
            <option value="t">t — time</option>
            <option value="x">x</option>
            <option value="y">y</option>
            <option value="z">z</option>
          </select>
        </label>
        <label>
          Plane position
          <output id="cut-readout">1.00</output>
          <input id="cut" type="range" min="0" max="1000" value="1000">
        </label>
        <label class="check">
          <input id="slab" type="checkbox">
          Cross-section only
        </label>
        <p id="count-readout"></p>
      </section>
      <section>
        <h2>Slice</h2>
        <canvas id="slice" width="220" height="220"></canvas>
      </section>
      <section>
        <h2>Interior probe</h2>
        <p id="probe-readout">Click the solid.</p>
      </section>
    </aside>
  </main>
  <script src="/app.js"></script>
</body>
</html>
