name: Release 4D Mind (All Platforms)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (e.g. v1.2.0)"
        required: false
        default: "v1.2.0"

permissions:
  contents: write

jobs:
  python-package:
    name: Build Python Wheel & sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build pytest numpy
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
      - name: Attach Python wheel and sdist to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag || 'v1.2.0' }}
          name: "4D Mind ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag || 'v1.2.0' }}"
          files: dist/*

  tauri-desktop:
    name: Build Tauri Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebKitGTK dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./desktop/src-tauri -> target"

      - name: Install desktop dependencies
        working-directory: ./desktop
        run: npm ci

      - name: Publish Release Bundles via Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag || 'v1.2.0' }}
          releaseName: "4D Mind ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag || 'v1.2.0' }}"
          releaseBody: |
            ## 4D Mind v1.2.0 — Cross-Platform Release
            - **4D Spatiotemporal Code Lens & Ablation Lens** (`fourd_code_lens`, `ablation_lens` in `tesseract/coder.py`): Analyzes any Git repository as a 4D solid `(t=commit, z=indentation, y=line, x=file)` and compares Eternalist full-block foresight against a Causal 3D witness.
            - **Self-Validating 4D CI/CD & Native File Harness**: Apply refactors directly from the Coder studio, automatically trigger local test suites (`pytest`, `cargo check`, `npm test`), auto-rollback on test failure, and measure before/after 4D topological health deltas.
            - **Zero-Cost Local Coding**: Run `grounded:4d-lens`, `lora:4d-coder` (`FOURD_MIND_LORA`), or local Ollama models (`local:deepseek-coder-v2:16b`, `local:deepseek-r1:14b`, `local:qwen2.5-coder:7b`) with zero API keys, plus `rtx16gb` preset support for 16 GB GPUs (RTX 5060 Ti / Colab T4).
            - **Deep Rust Tauri IPC & Zero-Lag Orbiting**: Native Rust IPC commands (`native_read_file`, `native_run_harness`, `native_patch_and_verify`) and typed-array `requestAnimationFrame` 4D viewport projection.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
